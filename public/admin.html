<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Shalimar</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="bg"></canvas>

  <nav class="nav">
    <a class="brand" href="index.html">SHALIMAR</a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="orders.html">Order</a>
      <a href="reviews.html">Reviews</a>
      <button id="logout" class="admin-link logout">Logout</button>
    </div>
  </nav>

  <main class="page">
    <h1 class="page-title">Admin Panel</h1>

    <div class="tabs">
      <button class="tab on" data-tab="inv">📦 Inventory</button>
      <button class="tab" data-tab="log">🕒 Staff Log</button>
    </div>

    <section id="tab-inv" class="tab-panel">
      <div class="card wide form-card">
        <div class="card-inner">
          <h3>Add item</h3>
          <form id="add-form" class="row-form">
            <input id="i-name" placeholder="Item name" required />
            <input id="i-price" type="number" min="0" step="1" placeholder="Price ₹" required />
            <input id="i-cat" placeholder="Category" value="Mains" />
            <input id="i-stock" type="number" min="0" placeholder="Stock" value="0" />
            <button class="btn gold" type="submit">Add</button>
          </form>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Item</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
          <tbody id="inv-body"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-log" class="tab-panel hidden">
      <div class="card wide form-card">
        <div class="card-inner">
          <h3>Add staff entry</h3>
          <form id="log-form" class="row-form">
            <input id="l-name" placeholder="Staff name" required />
            <select id="l-action">
              <option>Clock In</option>
              <option>Clock Out</option>
              <option>Shift Start</option>
              <option>Shift End</option>
              <option>Inventory Count</option>
              <option>Restock</option>
              <option>Note</option>
            </select>
            <input id="l-note" placeholder="Note (optional)" />
            <button class="btn gold" type="submit">Add</button>
          </form>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Staff</th><th>Action</th><th>Note</th><th>Time</th><th></th></tr></thead>
          <tbody id="log-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
