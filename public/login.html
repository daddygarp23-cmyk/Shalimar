<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Shalimar</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="bg"></canvas>

  <main class="page center">
    <div class="card login-card" data-tilt>
      <div class="card-inner">
        <h1 class="page-title">Admin Login</h1>
        <form id="login-form">
          <input id="password" type="password" placeholder="Admin password" required />
          <button class="btn gold" type="submit">Sign in</button>
          <p id="msg" class="msg"></p>
        </form>
      </div>
    </div>
    <a class="muted back" href="index.html">← Back to site</a>
  </main>

  <script type="module" src="js/app.js"></script>
  <script type="module">
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('password').value })
      });
      if (res.ok) location.href = 'admin.html';
      else { msg.textContent = 'Wrong password'; msg.className = 'msg err'; }
    });
  </script>
</body>
</html>
